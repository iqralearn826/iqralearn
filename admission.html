<section class="student-form">


<h1>Student Information:</h1>



<form action="https://formsubmit.co/iqralearn826@gmail.com" method="POST">



<label>
Student Full Name *
</label>

<input type="text" 
name="Student Full Name" 
placeholder="Student Full Name" 
required>




<label>
Student Age *
</label>

<input type="number" 
name="Student Age" 
placeholder="Student Age"
required>




<label>
Student Gender *
</label>


<select name="Student Gender" required>

<option value="">
Select Gender
</option>

<option>
Male
</option>

<option>
Female
</option>

</select>





<label>
Select Course *
</label>


<select name="Course" required>


<option value="">
Choose Course
</option>


<option>
Noorani Qaida
</option>


<option>
Quran Recitation
</option>


<option>
Quran Memorisation (Hifz)
</option>


<option>
Quran Translation
</option>


<option>
Islamic Studies
</option>


</select>






<label>
Teacher Gender Choice *
</label>


<select name="Teacher Preference" required>


<option>
Male Teacher
</option>


<option>
Female Teacher
</option>


<option>
Anyone
</option>


</select>







<h2>Select Your Preferred Teaching Days</h2>


<label>
Select Teaching Days *
</label>



<div class="days">


<label>
<input type="checkbox" name="Monday" value="Yes">
Monday
</label>


<label>
<input type="checkbox" name="Tuesday" value="Yes">
Tuesday
</label>


<label>
<input type="checkbox" name="Wednesday" value="Yes">
Wednesday
</label>


<label>
<input type="checkbox" name="Thursday" value="Yes">
Thursday
</label>


<label>
<input type="checkbox" name="Friday" value="Yes">
Friday
</label>


</div>






<label>
Preferred Class Time *
</label>


<select name="Class Time" required>

<option>1 PM</option>

<option>2 PM</option>

<option>3 PM</option>

<option>4 PM</option>

<option>5 PM</option>

<option>6 PM</option>

<option>7 PM</option>

</select>







<label>
Class Duration *
</label>


<select name="Class Duration" required>


<option>
30 Minutes
</option>


<option>
45 Minutes
</option>


<option>
1 Hour
</option>


</select>







<h1>Parent's Information:</h1>




<label>
Parent / Guardian Name *
</label>


<input type="text"
name="Parent Name"
placeholder="Parent Name"
required>





<label>
Relationship With Child *
</label>


<input type="text"
name="Relationship"
placeholder="Relationship with Child"
required>






<label>
Email *
</label>


<input type="email"
name="Parent Email"
placeholder="Email Address"
required>






<label>
WhatsApp Number *
</label>


<input type="tel"
name="WhatsApp Number"
placeholder="Phone Number"
required>







<h1>Other Information:</h1>




<label>
City *
</label>


<input type="text"
name="City"
placeholder="City"
required>





<label>
State *
</label>


<input type="text"
name="State"
placeholder="State"
required>





<label>
Country *
</label>


<input type="text"
name="Country"
placeholder="Country"
required>







<label>
Any Additional Comments For Us?
</label>


<textarea 
name="Additional Comments"
placeholder="Optional">
</textarea>








<h2>Last Step:</h2>



<label>


<input type="checkbox"
name="Consent"
required>


I Consent to Receive SMS, Email or Whatsapp Notifications, Alerts & Periodical Academics Related Communication from Iqra Learn.


</label>








<!-- FormSubmit Settings -->


<input type="hidden" name="_subject" value="New Student Registration - Iqra Learn">


<input type="hidden" name="_captcha" value="false">


<input type="hidden" name="_next" value="https://iqralearn826.github.io/iqralearn/thankyou.html">






<button type="submit">

Submit Application

</button>




</form>


</section>
